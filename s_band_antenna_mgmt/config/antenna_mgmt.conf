# S频段天线管理面软件配置文件

# BBU服务器配置
BBU_IP=10.10.10.6
BBU_PORT=30000

# PAAU客户端配置
PAAU_IP=10.10.10.8
PAAU_ID=0

# 相控阵产品标识
PRODUCT_MANUFACTURER=StarNet
PRODUCT_NAME=S-Band PAAU
PRODUCT_SERIAL=SN20260311001
PRODUCT_DATE=2026-03-11
PRODUCT_SERVICE_DATE=2026-03-11
PRODUCT_INFO=S-Band Antenna

# 软件版本信息
SOFTWARE_VERSION=v1.0.0
FIRMWARE_VERSION=FPGA_v1.0.0

# UART配置（与FPGA通信）
UART_DEVICE=/dev/ttyAMA0

# FPGA看门狗GPIO配置 (GPIO0_B6)
# GPIO控制器基地址 (GPIO0_BASE=0x28004000, GPIO1_BASE=0x28005000)
WATCHDOG_GPIO_BASE=0x28004000
# PIN复用寄存器偏移 (相对于PIN_MUX_BASE=0x28180000)
WATCHDOG_PIN_MUX_OFFSET=0x0214
# 功能选择位偏移 bit[9:8]
WATCHDOG_MUX_FUNC_BIT=8
# 上下拉位偏移 bit[11:10]
WATCHDOG_MUX_PULL_BIT=10
# GPIO端口号 (GPIO0_B6 = PORTB的bit 6)
WATCHDOG_GPIO_PORT=6
# 使用PORTB组 (1=PORTB, 0=PORTA)
WATCHDOG_USE_PORTB=1

# 重连配置
RECONNECT_INTERVAL_MS=3000

# 心跳配置
#HEARTBEAT_INTERVAL_MS=3000

# 日志配置
LOG_LEVEL=DEBUG
LOG_FILE=logs/antenna_mgmt.log

# 日志轮转配置
LOG_MAX_SIZE=10485760          # 10MB (字节)
LOG_MAX_BACKUPS=5              # 保留5个备份文件
LOG_ROTATE_ON_STARTUP=1        # 启动时检查并轮转 (1=启用, 0=禁用)

# FTP服务器配置（用于日志上传）
FTP_SERVER=10.10.10.6
FTP_PORT=21
