# S频段天线管理面软件配置文件

# BBU服务器配置
BBU_IP=10.10.10.6
BBU_PORT=30000

# PAAU客户端配置
PAAU_IP=10.10.10.8
PAAU_ID=0

# 相控阵产品标识
PRODUCT_MANUFACTURER=StarNet
PRODUCT_NAME=S-Band PAAU
PRODUCT_SERIAL=SN20260311001
PRODUCT_DATE=2026-03-11
PRODUCT_SERVICE_DATE=2026-03-11
PRODUCT_INFO=S-Band Antenna

# 软件版本信息
SOFTWARE_VERSION=v1.0.0
FIRMWARE_VERSION=FPGA_v1.0.0

# UART配置（与FPGA通信）
UART_DEVICE=/dev/ttyAMA0

# FPGA看门狗GPIO配置 (GPIO0_B6)
# GPIO控制器基地址 (GPIO0_BASE=0x28004000, GPIO1_BASE=0x28005000)
WATCHDOG_GPIO_BASE=0x28004000
# PIN复用寄存器偏移 (相对于PIN_MUX_BASE=0x28180000)
WATCHDOG_PIN_MUX_OFFSET=0x0214
# 功能选择位偏移 bit[9:8]
WATCHDOG_MUX_FUNC_BIT=8
# 上下拉位偏移 bit[11:10]
WATCHDOG_MUX_PULL_BIT=10
# GPIO端口号 (GPIO0_B6 = PORTB的bit 6)
WATCHDOG_GPIO_PORT=6
# 使用PORTB组 (1=PORTB, 0=PORTA)
WATCHDOG_USE_PORTB=1

# 重连配置
RECONNECT_INTERVAL_MS=3000

# 心跳配置
#HEARTBEAT_INTERVAL_MS=3000

# 日志配置
LOG_LEVEL=DEBUG
LOG_FILE=logs/antenna_mgmt.log

# 日志轮转配置
LOG_MAX_SIZE=10485760          # 10MB (字节)
LOG_MAX_BACKUPS=5              # 保留5个备份文件
LOG_ROTATE_ON_STARTUP=1        # 启动时检查并轮转 (1=启用, 0=禁用)

# FTP服务器配置（用于日志上传）
FTP_SERVER=10.10.10.6
FTP_PORT=21

# ============ 入站报文身份校验（北向链路加固）============
# 背景：改造前对入站报文的 paau_id 无任何校验，链路上任何能冒充 BBU 端点的主机
#       都能下发复位、固件上注、透传写 FPGA 等指令。
#
# PAAU_ID_CHECK 取值：
#   0 = 关闭   不校验，与改造前行为完全一致
#   1 = 仅记录  paau_id 不匹配时打 WARN，报文仍受理   ← 当前值
#   2 = 拒绝    不匹配则丢弃该报文
#
# ⚠️ 切到 2 之前必须先用 1 跑一段时间，确认日志中没有
#    "Inbound paau_id=... does not match local=..."，
#    否则会把 BBU 链路直接断掉。现场日志里第一次出现该 WARN 的同时，
#    也会打印 BBU 实际下发的值，据此把 PAAU_ID 改成对应的值再切 2。
PAAU_ID_CHECK=1

# 广播值：报文 paau_id 等于该值时一律受理（用于"面向全体 PAAU"的报文）。
# 不需要广播语义时设为负数（如 -1）即可关闭该项。
PAAU_ID_BROADCAST=255

# ============ 透传通道开关 ============
# 透传通道（msg 231-240）会把 BBU 送来的内容【原样】写到 FPGA：不做帧封装、
# 不校验命令码、不检查参数范围，是全项目权限最高的入站路径。
# 它本是调试/产测用的设施，正式部署若无该需求，建议置 0 直接封掉。
#
#   TRANSPARENT_ENABLE     1=启用（默认，保持现有行为）   0=拒绝该通道
#   TRANSPARENT_AUTO_REPLY 1=收到 BBU->PAAU 后自动回发（默认）  0=只收不回
#
# 注：关闭自动回复可同时消除"收到什么都原样弹回"的反射行为。
TRANSPARENT_ENABLE=1
TRANSPARENT_AUTO_REPLY=1

# ============ 校准结果查询的取值策略 ============
# 改造前 IE 308（校准结果查询）的应答恒填 0=成功，完全不读 FPGA 遥测，
# 于是硬件报校准失败时 BBU 仍收到"成功"，相控阵可能长期带错误相位/幅度工作。
#
#   CALIB_QUERY_REPORT_REAL=1  如实回报遥测 calib_result（默认）
#                          0  兼容旧行为，恒报成功
#
# 遥测不可用时回报 2（CALIB_RESULT_UNAVAILABLE），不伪造成功。
# ⚠️ 若 BBU 侧尚未准备好处理"校准失败"，可先置 0 维持旧行为。
CALIB_QUERY_REPORT_REAL=1

# ============ 复位动作的落地开关 ============
# 改造前软/硬复位的 system() 都被注释掉，但日志仍打印 "Service will restart in 2 seconds..."
# 并真的 sleep(2)，函数最后无条件返回 SUCCESS —— BBU 以为已重启，实际什么都没发生。
# 现已改为：FPGA 复位命令失败即如实返回失败；重启动作异步执行（不在接收线程里 sleep）。
#
#   RESET_RESTART_SERVICE  1=软复位后重启本服务（默认）  0=不重启
#   RESET_REBOOT_SYSTEM    1=硬复位后重启整个系统        0=不重启（默认）
#
# 整机重启影响面大，默认关闭；需要时按现场约定打开。
RESET_RESTART_SERVICE=1
RESET_REBOOT_SYSTEM=0
